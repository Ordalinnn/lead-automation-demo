<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оставить заявку</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --accent: #2563eb; --ok: #15803d; --err: #b91c1c; --border: #d9dde3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1b2027; --text: #e7eaee; --muted: #9aa3ae; --accent: #60a5fa; --ok: #4ade80; --err: #f87171; --border: #2f3640; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
         border-radius: 12px; padding: 28px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 22px; }
  p.hint { margin: -6px 0 4px; color: var(--muted); font-size: 14px; }
  label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  input, textarea { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--border);
                    border-radius: 8px; padding: 10px 12px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  textarea { min-height: 100px; resize: vertical; }
  .trap { position: absolute; left: -9999px; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0;
           border-radius: 8px; padding: 12px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #status { min-height: 1.5em; margin: 0; font-size: 14px; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
</style>
</head>
<body>
<form id="lead-form">
  <h1>Оставить заявку</h1>
  <p class="hint">Ответим в течение 15 минут в рабочее время</p>
  <label>Имя <input name="name" required maxlength="100" autocomplete="name"></label>
  <label>Телефон <input name="phone" type="tel" maxlength="30" autocomplete="tel"></label>
  <label>Email <input name="email" type="email" maxlength="100" autocomplete="email"></label>
  <label>Что вас интересует? <textarea name="message" maxlength="2000"></textarea></label>
  <label class="trap" aria-hidden="true">Сайт <input name="website" tabindex="-1" autocomplete="off"></label>
  <button type="submit">Отправить</button>
  <p id="status" role="status"></p>
</form>
<script>
  const form = document.getElementById("lead-form");
  const status = document.getElementById("status");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    if (!data.phone.trim() && !data.email.trim()) {
      status.className = "err"; status.textContent = "Укажите телефон или email"; return;
    }
    const button = form.querySelector("button");
    button.disabled = true; status.className = ""; status.textContent = "Отправляем…";
    try {
      const res = await fetch("/api/lead", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data),
      });
      if (!res.ok) throw new Error();
      form.reset();
      status.className = "ok"; status.textContent = "Спасибо! Заявка принята, скоро свяжемся.";
    } catch {
      status.className = "err"; status.textContent = "Не удалось отправить. Попробуйте ещё раз или позвоните нам.";
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
